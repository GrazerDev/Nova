name: NovaForge Engine
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/engine.js'
      - 'docs/engine.wasm'
      - 'docs/leaderboard.json'
      - 'README.md'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  forge-process:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: 🔨 Compile C++ to WASM
        run: |
          em++ src/core.cpp -O3 \
          -s WASM=1 \
          -s MODULARIZE=1 \
          -s EXPORT_NAME="createModule" \
          -s EXPORTED_FUNCTIONS="['_run_challenge']" \
          -s EXPORTED_RUNTIME_METHODS="['cwrap']" \
          -o docs/engine.js

      - name: ⏱️ Run Benchmark
        run: node judge.js

      - name: ✅ Update Docs (Auto-Deploy)
        if: github.event_name == 'push'
        run: |
          git config --global user.name "NovaForge Bot"
          git config --global user.email "bot@novaforge.engine"
          git add docs/engine.js docs/engine.wasm
          git commit -m "🚀 Automated Build: Update WASM Engine [skip ci]" || echo "No changes to commit"
          git push
