name: NovaForge Engine
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/leaderboard.json'
      - 'docs/engine.js'
      - 'docs/engine.wasm'
      - 'README.md'
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  forge-process:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: 🔨 Compile C++ to WASM
        run: |
          em++ src/core.cpp -O3 \
          -s WASM=1 \
          -s ALLOW_MEMORY_GROWTH=1 \
          -s EXPORTED_FUNCTIONS="['_run_challenge']" \
          -s EXPORTED_RUNTIME_METHODS="['cwrap']" \
          -o docs/engine.js
